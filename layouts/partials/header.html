<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-name">{{ .Site.Params.societyName }}</span>
    </a>
    <nav class="site-nav">
      {{ $p := .RelPermalink }}
      <a href="{{ "/" | relURL }}" class="nav-link{{ if .IsHome }} nav-link-active{{ end }}">Match Hub</a>
      <a href="{{ "/order-of-merit/" | relURL }}" class="nav-link{{ if hasPrefix $p (relURL "/order-of-merit/") }} nav-link-active{{ end }}"><span class="nav-full">Order of Merit</span><span class="nav-short">OoM</span></a>
      <a href="{{ "/pc-oom/" | relURL }}" class="nav-link{{ if hasPrefix $p (relURL "/pc-oom/") }} nav-link-active{{ end }}"><span class="nav-full">PC Order of Merit</span><span class="nav-short">PC OoM</span></a>
      <a href="{{ "/dartsity/" | relURL }}" class="nav-link{{ if hasPrefix $p (relURL "/dartsity/") }} nav-link-active{{ end }}">Dartsity</a>
      <a href="{{ "/futures/" | relURL }}" class="nav-link{{ if hasPrefix $p (relURL "/futures/") }} nav-link-active{{ end }}">Futures</a>
      <a href="{{ "/leaderboard/" | relURL }}" class="nav-link{{ if hasPrefix $p (relURL "/leaderboard/") }} nav-link-active{{ end }}"><span class="nav-full">Leaderboard</span><span class="nav-short">Bets</span></a>
      <a href="{{ "/account/" | relURL }}" class="nav-link nav-link-quiet{{ if hasPrefix $p (relURL "/account/") }} nav-link-active{{ end }}">Account</a>
      <a href="{{ "/admin/" | relURL }}" class="nav-link nav-link-quiet">Admin</a>
    </nav>
  </div>
</header>
