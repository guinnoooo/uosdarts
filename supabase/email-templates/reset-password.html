<!-- Supabase > Authentication > Emails > Templates > Reset password
     Subject: Reset your UOS Darts password -->
<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#0d0d0d;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#161616;border:1px solid #2b2b2b;border-radius:12px;">
        <tr><td style="padding:28px 28px 8px;font-family:Inter,Arial,sans-serif;">
          <div style="font-size:20px;font-weight:800;color:#f2f2f2;letter-spacing:.02em;">UOS Darts</div>
        </td></tr>
        <tr><td style="padding:8px 28px 0;font-family:Inter,Arial,sans-serif;font-size:15px;line-height:1.55;color:#cfcfcf;">
          <p style="margin:0 0 14px;">Hi {{ if .Data.display_name }}{{ .Data.display_name }}{{ else }}there{{ end }}</p>
          <p style="margin:0 0 22px;">Reset your password below.</p>
        </td></tr>
        <tr><td align="center" style="padding:0 28px 26px;">
          <a href="{{ .ConfirmationURL }}"
             style="display:inline-block;background:#c9a961;color:#17150c;font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none;padding:12px 28px;border-radius:8px;">
            Reset Password
          </a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
