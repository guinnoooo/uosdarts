baseURL = "https://uosdarts.com/"
languageCode = "en-gb"
title = "UOS Darts"

buildDrafts = false

[params]
  societyName = "UOS Darts"
  pageTitle = "Order of Merit"
  season = "2026/27"

  # --- Ranking fallback ---
  # Live points come from Supabase. This CSV is the copy rendered into the page
  # at build time so the table is never blank: refresh it from the admin page
  # when you want the published fallback brought up to date.
  rankingsCSV = "data/rankings.csv"
  pcRankingsCSV = "data/pc-rankings.csv"
  nameColumn = "player_name"
  pointsColumn = "total_points"

[markup.goldmark.renderer]
  unsafe = true
