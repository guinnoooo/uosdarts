name: Deploy the place-bet function

# The place-bet edge function prices bets with the same code as the site, so
# it's redeployed whenever that code changes. Needs one repository secret:
# SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens). The function checks
# who is calling itself, so the gateway JWT check is off (that also lets the
# browser's CORS preflight through).

on:
  push:
    branches: ["main"]
    paths:
      - "static/js/winprob.js"
      - "static/js/prices.js"
      - "static/js/outright.js"
      - "static/js/fixtures.js"
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Finding the latest CLI uses GitHub's API, which sometimes refuses with
      # "rate limit exceeded". If it does, wait a minute and try once more.
      - uses: supabase/setup-cli@v1
        id: cli
        continue-on-error: true
        with:
          version: latest
      - if: steps.cli.outcome == 'failure'
        run: sleep 60
      - if: steps.cli.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Copy the shared model code in next to the function
        run: cp static/js/winprob.js static/js/prices.js static/js/outright.js static/js/fixtures.js supabase/functions/place-bet/
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy place-bet --remote=nexwoylohbahntjappaq --use-api --no-verify-jwt --yes
