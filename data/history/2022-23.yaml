notable:
- Luke Davies and Nathan Hennessy beat players from Hallam and Trent in an exhibition at the Magna Centre to play Gerwyn Price and Gary Anderson.
- Adam Warner won Week 8 of the Modus Super Series.
- Adam Warner won a PDC Tour Card at Q-School, the first uni darts player to turn professional.
- Uni Arms Academicals won the Franchise League Team Plate, beating Woodbourne Vintage 5-0 in the final.
- Luke Davies and Jack Lewis won the Franchise League Captains Pairs Cup, and Luke Davies won the Captains Singles Cup.
